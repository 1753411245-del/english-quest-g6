<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f6bed">
<meta name="description" content="人教版七年级上册英语闯关小游戏，单文件、零联网，双击即玩。">
<!-- 安全基线：只允许内联脚本与样式，禁止一切外部资源、网络请求和表单提交。
     若日后需要引入外部资源，请先更新此策略，不要直接删除。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>英语闯关 · 七年级上册</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --ink:#18223c; --muted:#6d7a99; --line:#e6ebf7;
    --blue:#4f6bed; --blue-d:#3a52c4; --violet:#8a63e8;
    --gold:#f6a723; --green:#20b878; --red:#f2545b;
    --shadow-sm:0 2px 6px rgba(24,34,60,.05),0 8px 20px rgba(24,34,60,.06);
    --shadow:0 12px 32px rgba(35,60,130,.10),0 2px 6px rgba(35,60,130,.05);
    --shadow-lg:0 26px 60px rgba(35,60,130,.16),0 8px 20px rgba(35,60,130,.08);
  }
  html,body{min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink); background-color:#f4f7fd;
    background-image:
      radial-gradient(900px 520px at 6% -10%, #dde8ff 0%, transparent 58%),
      radial-gradient(820px 480px at 102% 2%, #ffe7cf 0%, transparent 52%),
      radial-gradient(760px 520px at 50% 112%, #e6ddfb 0%, transparent 56%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  .bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg-deco i{position:absolute;border-radius:50%;filter:blur(34px);opacity:.55;animation:float 15s ease-in-out infinite}
  .bg-deco i:nth-child(1){width:230px;height:230px;background:#c9d8ff;top:-70px;left:-60px}
  .bg-deco i:nth-child(2){width:190px;height:190px;background:#ffd9b8;top:24%;right:-70px;animation-delay:-4s}
  .bg-deco i:nth-child(3){width:210px;height:210px;background:#dcd1ff;bottom:4%;left:-80px;animation-delay:-9s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(14px,-20px) scale(1.06)}}

  #app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:16px 16px 52px}
  .view{animation:fadeUp .34s cubic-bezier(.2,.8,.3,1) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-8px)}38%{transform:translateX(7px)}58%{transform:translateX(-5px)}78%{transform:translateX(3px)}}
  @keyframes ring{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.28);opacity:0}}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes shine{0%{background-position:-140% 0}100%{background-position:240% 0}}
  @keyframes fall{0%{transform:translate3d(0,-30px,0) rotate(0);opacity:1}100%{transform:translate3d(var(--dx),105vh,0) rotate(720deg);opacity:.85}}
  @keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .brand .mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(140deg,#5b78f0,#8a63e8);box-shadow:0 8px 18px rgba(79,107,237,.34),inset 0 1px 0 rgba(255,255,255,.4);flex:0 0 auto}
  .brand .tt{line-height:1.15;min-width:0}
  .brand .name{font-size:15px;font-weight:900;letter-spacing:.2px;white-space:nowrap}
  .brand .sub{font-size:10.5px;color:#93a0bb;font-weight:800;letter-spacing:.6px;margin-top:2px;white-space:nowrap}
  .stats{display:flex;gap:6px;align-items:center}
  .stat{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.9);
    border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:900;color:#22305a;
    box-shadow:0 4px 14px rgba(35,60,130,.08);backdrop-filter:blur(8px)}
  .stat .ico{display:grid;place-items:center;line-height:0}
  .coin{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ffeaa8,#f6a723 62%,#dd8a09);
    border:1.5px solid #c97c07;position:relative;display:block}
  .coin::after{content:'';position:absolute;inset:3.5px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55)}
  .iconbtn{width:38px;height:38px;border-radius:13px;background:#fff;border:1px solid var(--line);
    display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-sm);font-size:15px;color:#4a5680;
    font-family:inherit;transition:.15s;flex:0 0 auto}
  .iconbtn:hover{transform:translateY(-1px);border-color:#c9d6ff;color:var(--blue-d)}
  .iconbtn:active{transform:scale(.95)}

  /* ---------- hero ---------- */
  .hero{position:relative;border-radius:28px;padding:22px 20px;color:#fff;overflow:hidden;
    background:linear-gradient(135deg,#4f6bed 0%,#6a54ec 48%,#9a5cf0 100%);
    box-shadow:0 24px 52px rgba(79,107,237,.34),inset 0 1px 0 rgba(255,255,255,.28)}
  .hero::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;top:-160px;right:-90px;
    background:radial-gradient(circle,rgba(255,255,255,.30),transparent 68%)}
  .hero::after{content:'';position:absolute;width:220px;height:220px;border-radius:50%;bottom:-140px;left:-60px;
    background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
  .hero .inner{position:relative;z-index:2;display:flex;align-items:center;gap:10px}
  .hero .txt{flex:1;min-width:0}
  .hero h1{font-size:23px;font-weight:900;line-height:1.25;letter-spacing:.2px;text-shadow:0 2px 8px rgba(40,40,120,.18)}
  .hero .sub{font-size:12.5px;opacity:.9;margin-top:6px;font-weight:600}
  .hero .pills{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:6px 10px;border-radius:999px;
    font-size:12px;font-weight:800;backdrop-filter:blur(4px);white-space:nowrap}
  .hero .lvl{margin-top:14px}
  .hero .lvlbar{height:8px;border-radius:99px;background:rgba(255,255,255,.24);overflow:hidden}
  .hero .lvlbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffe08a,#ffc247);
    box-shadow:0 0 12px rgba(255,214,102,.8);transition:width .5s}
  .hero .lvtxt{display:flex;justify-content:space-between;font-size:11px;font-weight:800;opacity:.92;margin-top:6px}
  .mascot{width:96px;flex:0 0 auto;animation:bob 3.6s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(20,20,80,.28))}
  .mascot svg{width:100%;height:auto;display:block}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}

  /* ---------- section ---------- */
  .shead{display:flex;align-items:baseline;justify-content:space-between;margin:24px 4px 0;gap:10px}
  .shead h2{font-size:16.5px;font-weight:900;letter-spacing:.2px}
  .shead .s{font-size:11.5px;color:var(--muted);font-weight:700}
  .hintline{font-size:12.5px;color:var(--muted);margin:5px 4px 12px;line-height:1.6}

  .quickrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .qbtn{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid rgba(230,235,247,.95);border-radius:18px;
    padding:13px 15px;cursor:pointer;box-shadow:var(--shadow-sm);transition:.16s;font-family:inherit;text-align:left}
  .qbtn:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#cfdbff}
  .qbtn:active{transform:translateY(0) scale(.99)}
  .qbtn .qi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .qbtn .qm{min-width:0;display:flex;flex-direction:column;gap:3px}
  .qbtn .qt{font-size:13.5px;font-weight:900;color:var(--ink);white-space:nowrap}
  .qbtn .qs{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
  .qbtn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  /* ---------- unit cards ---------- */
  .ugrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .ucard{position:relative;background:#fff;border-radius:24px;overflow:hidden;border:1px solid rgba(230,235,247,.95);
    box-shadow:var(--shadow-sm);cursor:pointer;text-align:left;font-family:inherit;padding:0;transition:transform .2s cubic-bezier(.2,.9,.3,1),box-shadow .2s}
  .ucard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .ucard:active{transform:translateY(-1px) scale(.995)}
  .uart{aspect-ratio:5/3;position:relative;overflow:hidden;background:#eef3ff}
  .uart svg{width:100%;height:100%;display:block;transition:transform .4s}
  .ucard:hover .uart svg{transform:scale(1.05)}
  .uart .glow{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(255,255,255,.55))}
  .ubody{padding:12px 14px 15px;position:relative}
  .uno{font-size:10.5px;font-weight:900;letter-spacing:1px;color:#9aa6c0}
  .utitle{font-size:15.5px;font-weight:900;margin-top:3px;line-height:1.2;color:var(--ink)}
  .ucn{font-size:12px;color:var(--muted);margin-top:2px;font-weight:600}
  .ubar{height:7px;border-radius:99px;background:#eef1f9;overflow:hidden;margin-top:11px;position:relative}
  .ubar i{display:block;height:100%;border-radius:99px;transition:width .5s}
  .umeta{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:10.5px;font-weight:800;color:#9aa6c0}
  .chip-tag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:900;color:#fff;padding:4px 9px;border-radius:99px;
    background:rgba(24,34,60,.42);backdrop-filter:blur(6px);letter-spacing:.4px}
  .chap{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
    background:rgba(255,255,255,.86);font-size:13px;box-shadow:0 3px 8px rgba(20,30,60,.14)}
  .ucard.locked{cursor:not-allowed}
  .ucard.locked .uart svg{filter:grayscale(1) brightness(1.04);opacity:.62}
  .ucard.locked:hover{transform:none;box-shadow:var(--shadow-sm)}
  .ucard.locked .ubar{display:none}

  /* ---------- level map ---------- */
  .mapcard{background:#fff;border-radius:26px;padding:22px 14px 18px;box-shadow:var(--shadow);border:1px solid var(--line);margin-top:16px;position:relative;overflow:hidden}
  .mapcard::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#4f6bed,#8a63e8,#f5a623)}
  /* 7 关：桌面上单行 7 列；窄屏 4 列两行。节点数不固定，故不画连接虚线 */
  .path{display:grid;grid-template-columns:repeat(7,1fr);gap:14px 2px;position:relative;padding:4px 2px 0}
  .node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:7px;
    background:none;border:none;cursor:pointer;font-family:inherit;flex:1;padding:0;transition:.18s}
  .node:hover{transform:translateY(-2px)}
  .dot{width:56px;height:56px;border-radius:19px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;
    box-shadow:0 10px 20px rgba(35,60,130,.2),inset 0 1px 0 rgba(255,255,255,.35);position:relative;transition:.18s;letter-spacing:-1px}
  .node.locked .dot{background:#eaeefa!important;color:#b9c2d8;box-shadow:inset 0 2px 4px rgba(24,34,60,.06);font-size:15px}
  .node.locked{cursor:not-allowed}
  .node.locked:hover{transform:none}
  .node.cur .dot::after{content:'';position:absolute;inset:-6px;border-radius:24px;border:3px solid rgba(79,107,237,.4);animation:ring 1.7s infinite}
  .nlabel{font-size:11px;font-weight:900;color:#5a6684;letter-spacing:.2px}
  .node.locked .nlabel{color:#b3bdd4}
  .nstars{font-size:9.5px;letter-spacing:1.5px;line-height:1;height:10px}
  .ms{letter-spacing:1.5px;white-space:nowrap;display:inline-block}
  .ms .on{color:#f6a723}
  .ms .off{color:#dfe5f2}
  .maptip{display:flex;align-items:center;gap:8px;margin-top:16px;padding:11px 13px;border-radius:14px;
    background:linear-gradient(135deg,#f3f6ff,#f8faff);font-size:12px;color:#5a6684;font-weight:700;line-height:1.5}
  .maptip b{color:#3d54c9}

  /* ---------- game ---------- */
  .hud{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .hud .bar{flex:1;height:13px;border-radius:99px;background:#e7edfb;overflow:hidden;box-shadow:inset 0 1px 3px rgba(24,34,60,.08)}
  .hud .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5b78f0,#a06bf5);
    box-shadow:0 0 14px rgba(140,110,245,.65);transition:width .4s cubic-bezier(.3,1.2,.5,1);position:relative}
  .hud .cnt{font-size:12px;font-weight:900;color:#7b88a6;font-variant-numeric:tabular-nums;white-space:nowrap}
  .combo{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:5px 12px;border-radius:99px;
    background:linear-gradient(135deg,#fff2d6,#ffe6b0);color:#b26b00;font-size:12px;font-weight:900;
    box-shadow:0 6px 16px rgba(245,167,35,.25);animation:slideUp .25s}

  .qcard{background:#fff;border-radius:28px;padding:22px 20px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.9);
    position:relative;display:flex;flex-direction:column;min-height:min(58vh,480px);animation:cardIn .3s cubic-bezier(.2,.8,.3,1) both}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .qbody{flex:1;display:flex;flex-direction:column;justify-content:center}
  .qcard.shake{animation:shake .42s}
  .qtype{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;font-size:11px;font-weight:900;letter-spacing:.6px;
    color:#5a6684;background:#f2f5fd;border-radius:99px;padding:5px 11px;margin-bottom:4px}
  .qcard.compact{min-height:auto}
  .qprompt{font-size:21px;font-weight:900;line-height:1.45;margin:14px 0 6px;text-align:center;word-break:break-word;letter-spacing:.2px}
  .qprompt.small{font-size:16px;color:#5a6684;font-weight:800;line-height:1.6}
  .qsub{text-align:center;color:#93a0bb;font-size:12.5px;font-weight:700}
  .center{text-align:center}
  .options{display:grid;gap:10px;margin-top:16px}

  .opt{display:flex;align-items:center;gap:12px;width:100%;background:#f8faff;border:2px solid #e7edfa;border-radius:16px;
    padding:13px 15px;font-size:16px;font-weight:800;color:var(--ink);text-align:left;cursor:pointer;transition:.14s;font-family:inherit}
  .opt .key{width:27px;height:27px;border-radius:9px;background:#fff;border:1.5px solid #dde5f8;color:#95a2bd;
    display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto;transition:.14s}
  .opt .txt{flex:1;min-width:0;word-break:break-word;line-height:1.4}
  .opt:hover{border-color:#b9c9ff;background:#f1f5ff;transform:translateX(3px)}
  .opt:hover .key{border-color:#b9c9ff;color:var(--blue-d)}
  .opt:disabled{cursor:default;transform:none}
  .opt.dim{opacity:.42;filter:saturate(.5)}
  .opt.correct{border-color:#20b878;background:linear-gradient(100deg,#e8fbf1,#f4fdf9);color:#0f7c50}
  .opt.correct .key{background:#20b878;border-color:#20b878;color:#fff}
  .opt.wrong{border-color:#f2545b;background:linear-gradient(100deg,#fdeded,#fef7f7);color:#c02d34;animation:shake .42s}
  .opt.wrong .key{background:#f2545b;border-color:#f2545b;color:#fff}

  .fb{margin-top:16px;border-radius:16px;padding:13px 15px;font-size:13.5px;display:none;font-weight:700;
    line-height:1.55;align-items:flex-start;gap:10px;animation:slideUp .26s}
  .fb.show{display:flex}
  .fb .fbi{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;flex:0 0 auto;margin-top:1px}
  .fb.ok{background:linear-gradient(135deg,#e8fbf1,#f4fdf9);color:#0f7c50;border:1px solid #b6eed4}
  .fb.ok .fbi{background:#20b878}
  .fb.no{background:linear-gradient(135deg,#fdeded,#fef7f7);color:#c02d34;border:1px solid #f8cbce}
  .fb.no .fbi{background:#f2545b}
  .fb.info{background:#f4f7ff;color:#5a6684;border:1px solid #e2e9f8}
  .fb.info .fbi{background:#9aa8c6}
  .fb b{font-weight:900}

  .btn{border:none;border-radius:16px;padding:14px 20px;font-size:15px;font-weight:900;cursor:pointer;
    background:linear-gradient(135deg,#4f6bed,#7358ee);color:#fff;font-family:inherit;letter-spacing:.3px;
    box-shadow:0 10px 24px rgba(79,107,237,.32),inset 0 1px 0 rgba(255,255,255,.24);transition:.16s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(79,107,237,.4)}
  .btn:active{transform:translateY(0) scale(.99)}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
  .btn.ghost{background:#fff;color:#3d54c9;border:1.5px solid #dbe3f7;box-shadow:var(--shadow-sm)}
  .btn.ghost:hover{background:#f7f9ff;border-color:#c3d2fb}
  .btn.gold{background:linear-gradient(135deg,#ffc247,#f59e0b);box-shadow:0 10px 24px rgba(245,158,11,.34),inset 0 1px 0 rgba(255,255,255,.35)}
  .btn.block{width:100%;margin-top:16px}
  .btn.sm{padding:10px 14px;font-size:13px;border-radius:13px}

  .answerline{min-height:62px;border:2px dashed #c9d6ff;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:7px;
    margin-top:16px;background:linear-gradient(180deg,#f7f9ff,#fbfcff);align-content:flex-start;transition:.15s}
  .answerline:empty::after{content:'把单词按顺序放到这里';color:#b3bdd4;font-size:12.5px;font-weight:700;margin:auto}
  .answerline.hot{border-color:#a9bcff;background:#f2f6ff}
  .bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{background:#fff;border:2px solid #dde5f8;border-radius:13px;padding:9px 14px;font-size:15px;font-weight:800;
    cursor:pointer;transition:.12s;color:var(--ink);font-family:inherit;box-shadow:0 2px 6px rgba(35,60,130,.05)}
  .chip:hover{border-color:#b9c9ff;transform:translateY(-2px);box-shadow:0 6px 14px rgba(79,107,237,.16)}
  .chip:active{transform:translateY(0)}
  .chip.used{opacity:.3;cursor:default;transform:none;box-shadow:none}
  .answerline .chip{background:linear-gradient(180deg,#eef3ff,#e6edff);border-color:#b9c9ff;color:#2f45a8}

  .speakword{font-size:27px;font-weight:900;margin:14px 0 8px;text-align:center;line-height:1.35;word-break:break-word;letter-spacing:.2px}
  .speakcn{color:#8b98b5;font-size:13px;text-align:center;font-weight:700}
  .mic{width:88px;height:88px;border-radius:50%;border:none;cursor:pointer;margin:20px auto 0;display:grid;place-items:center;
    background:linear-gradient(140deg,#5b78f0,#8a63e8);color:#fff;font-size:12.5px;font-weight:900;line-height:1.35;font-family:inherit;
    box-shadow:0 14px 30px rgba(79,107,237,.4),inset 0 2px 0 rgba(255,255,255,.3);transition:.18s}
  .mic:hover{transform:scale(1.04)}
  .mic:active{transform:scale(.97)}
  .mic.rec{animation:pulse 1.2s infinite;background:linear-gradient(140deg,#f2545b,#e83a8a)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,84,91,.55)}100%{box-shadow:0 0 0 22px rgba(242,84,91,0)}}

  /* ---------- 拼写关 ---------- */
  .spellline{min-height:60px;border:2px dashed #c9d6ff;border-radius:16px;padding:9px;display:flex;flex-wrap:wrap;gap:6px;
    margin-top:16px;background:linear-gradient(180deg,#f7f9ff,#fbfcff);align-items:center;justify-content:center;transition:.15s}
  .spellline .ph{color:#b3bdd4;font-size:12.5px;font-weight:700}
  .spellline .sltr{width:38px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:20px;font-weight:900;
    background:linear-gradient(180deg,#eef3ff,#e2eaff);border:2px solid #b9c9ff;color:#2f45a8;cursor:pointer;

function rnd(n){ return Math.floor(Math.random() * n); }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function sample(a,n){ return shuffle(a).slice(0,n); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function options4(answer, pool){
  const uniq = [];
  for (const v of pool){ if (v !== answer && uniq.indexOf(v) < 0) uniq.push(v); }
  return shuffle([answer].concat(shuffle(uniq).slice(0,3)));
}

   ============================================================ */
let AC = null;
function tone(freq, dur, type, vol, delay){
  if (!S.sound) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch(e){}
}

/* ============================================================
   出题
   ============================================================ */
function makeWordChoice(u, w, mode){
  const pool = u.words.filter(x => x !== w);
  if (mode === 'cn2en'){
    return { type:'choice', qtype:'word', mode, unitId:u.id, prompt:w[1], answer:w[0], options:options4(w[0], pool.map(x=>x[0])) };
  }
  return { type:'choice', qtype:'word', mode, unitId:u.id, prompt:w[0], answer:w[1], options:options4(w[1], pool.map(x=>x[1])) };
}
function makeListenWord(u, w){
  const pool = u.words.filter(x => x !== w);
  return { type:'listen', unitId:u.id, audio:w[0], isWord:true, prompt:'听录音，选出正确的意思', answer:w[1], options:options4(w[1], pool.map(x=>x[1])) };
}
function makeListenSentence(u, s){
  const pool = u.sentences.filter(x => x !== s);
  return { type:'listen', unitId:u.id, audio:s[0], isWord:false, prompt:'听句子，选出正确的意思', answer:s[1], options:options4(s[1], pool.map(x=>x[1])) };
}
function makeOrder(u, s){
  const clean = s[0].replace(/[.,!?;:]/g,'').trim();
  const tokens = clean.split(/\s+/).filter(Boolean);
  const answer = tokens.join(' ').toLowerCase();
  return { type:'order', unitId:u.id, cn:s[1], display:s[0], tokens:shuffle(tokens), answer:answer };
}
function makeFill(u, s){
  const clean = s[0].replace(/[.,!?;:]/g,'').trim();
  const tokens = clean.split(/\s+/).filter(Boolean);
  const stop = ['a','an','the','is','was','am','are','i','we','you','it','to','of','and','in','at','on','my','did','do'];
  const vocab = u.words.map(function(x){ return x[0].toLowerCase(); });
  let idx = -1;
  /* 优先挖本单元词汇，让填空真正复现课标词；不挖句首词，避免大小写与选项重复 */
  for (let i = tokens.length - 1; i >= 1; i--){
    if (vocab.indexOf(tokens[i].toLowerCase()) >= 0){ idx = i; break; }
  }
  if (idx < 0){
    for (let i = tokens.length - 1; i >= 1; i--){
      const t = tokens[i].toLowerCase();
      if (t.length > 2 && stop.indexOf(t) < 0){ idx = i; break; }
    }
  }
  if (idx < 0) idx = tokens.length - 1;
  const answer = tokens[idx];
  const prompt = tokens.map((t,i) => i === idx ? '___' : t).join(' ');
  return { type:'choice', qtype:'fill', unitId:u.id, prompt:prompt, answer:answer, note:s[1], options:options4(answer, u.words.map(x=>x[0])) };
}

/* --- 拼写关：点击字母块拼出单词 --- */
function makeSpell(u, w){
  const letters = w[0].replace(/[^a-zA-Z]/g, '').split('');
  const lower = letters.map(function(c){ return c.toLowerCase(); });
  const pool = 'abcdefghijklmnopqrstuvwxyz'.split('').filter(function(c){ return lower.indexOf(c) < 0; });
  return {
    type:'spell', unitId:u.id, cn:w[1], answer:w[0],
    letters: shuffle(letters.concat(sample(pool, 2))),
    hint: w[0].charAt(0) + ' 开头 · 共 ' + letters.length + ' 个字母'
  };
}
function buildSpellLevel(u){
  return sample(u.words, 8).map(function(w){ return makeSpell(u, w); });
}

/* --- 语法关：选项题 + 语法点 + 错因解析 --- */
function makeGrammar(u, g){
  return {
    type:'grammar', unitId:u.id,
    prompt: g[0], answer: g[1],
    options: options4(g[1], g[2]),
    point: g[3], explain: g[4]
  };
}
function buildGrammarLevel(u){
  return sample(u.grammar, 6).map(function(g){ return makeGrammar(u, g); });
}

function buildWordLevel(u){
  return sample(u.words, 8).map((w,i) => makeWordChoice(u, w, i % 2 === 0 ? 'cn2en' : 'en2cn'));
}
function buildListenLevel(u){
  const ws = sample(u.words, 3), ss = sample(u.sentences, 3);
  const out = [];
  for (let i=0;i<3;i++){ out.push(makeListenWord(u, ws[i])); out.push(makeListenSentence(u, ss[i])); }
  return out;
}
function buildSentenceLevel(u){
  const ss = sample(u.sentences, 6);
  const qs = [];
  for (let i=0;i<3;i++) qs.push(makeOrder(u, ss[i]));
  for (let i=3;i<6;i++) qs.push(makeFill(u, ss[i]));
  return shuffle(qs);
}
function buildSpeakLevel(u){
  const ws = sample(u.words, 2), ss = sample(u.sentences, 2);
  const out = [];
  ws.forEach(w => out.push({ type:'speak', unitId:u.id, text:w[0], cn:w[1] }));
  ss.forEach(s => out.push({ type:'speak', unitId:u.id, text:s[0], cn:s[1] }));
  return out;
}
function buildBoss(u){
  const qs = [];
  const w1 = sample(u.words, 4);
  qs.push(makeWordChoice(u, w1[0], 'cn2en'));
  qs.push(makeWordChoice(u, w1[1], 'en2cn'));
  qs.push(makeListenWord(u, w1[2]));
  qs.push(makeSpell(u, w1[3]));
  const w2 = sample(u.words, 2);
  qs.push(makeWordChoice(u, w2[0], 'cn2en'));
  qs.push(makeSpell(u, w2[1]));
  const s1 = sample(u.sentences, 4);
  qs.push(makeListenSentence(u, s1[0]));
  qs.push(makeOrder(u, s1[1]));
  qs.push(makeFill(u, s1[2]));
  qs.push(makeOrder(u, s1[3]));
  const g1 = sample(u.grammar, 2);
  qs.push(makeGrammar(u, g1[0]));
  qs.push(makeGrammar(u, g1[1]));
  return shuffle(qs);
}

/* ============================================================
   导航
   ============================================================ */
const app = document.getElementById('app');
function goHome(){ view = { name:'home' }; render(); }
function openUnit(uid){ sfxTap(); view = { name:'unit', unitId:uid }; render(); }
function openCollect(){ sfxTap(); view = { name:'collect' }; render(); }
function quitLevel(){
  if (confirm('退出本次练习？已答错的题会保留在复习队列。')) { goHome(); }
}
function resetAll(){
  if (confirm('确定清除所有学习记录吗？此操作不可恢复。')){ try{ localStorage.removeItem(LS); }catch(e){} S = loadState(); goHome(); }
}

function startLevel(uid, idx){
  const u = BOOK.units.find(x => x.id === uid);
  if (!u) return;
  sfxTap();
  touchStreak();
  const builders = [buildWordLevel, buildSpellLevel, buildListenLevel, buildSentenceLevel, buildGrammarLevel, buildSpeakLevel, buildBoss];
  const qs = (builders[idx] || buildWordLevel)(u);
  G = { uid:uid, idx:idx, unit:u, qs:qs, i:0, correct:0, wrongList:[], answered:false, mode:'normal', orderPicked:[], spellPicked:[], combo:0 };
  view = { name:'game' };
  render();
}

function openReview(){
  if (!S.wrong.length) return;
  sfxTap();
  const items = shuffle(S.wrong).slice(0, 10);
  G = { uid:'review', idx:NLV, unit:null, qs:items, i:0, correct:0, wrongList:[], answered:false, mode:'review', orderPicked:[], spellPicked:[], combo:0 };
  view = { name:'game' };
  render();
}

function topbar(){
  const sound = S.sound ? '🔊' : '🔇';
  return '<div class="topbar">' +
    '<div class="brand">' +
      '<div class="mark">' + mascotMark() + '</div>' +
      '<div class="tt"><div class="name">英语闯关</div><div class="sub">七年级上册 · PEP</div></div>' +
    '</div>' +
    '<div class="stats">' +
      '<span class="stat" title="总星星"><span class="ico" style="color:#f6a723">★</span>' + totalStars() + '</span>' +
      '<span class="stat" title="金币"><span class="coin"></span>' + S.coins + '</span>' +
      '<span class="stat" title="等级">Lv' + lv() + '</span>' +
      '<button class="iconbtn" onclick="toggleSound()" title="音效开关">' + sound + '</button>' +

}

  return '<svg viewBox="0 0 24 24" width="21" height="21">' +

function render(){
  let html = '';
  if (view.name === 'home') html = viewHome();
  else if (view.name === 'unit') html = viewUnit(view.unitId);
  else if (view.name === 'game') html = viewGame();
  else if (view.name === 'result') html = viewResult();
  else if (view.name === 'collect') html = viewCollect();
  app.innerHTML = topbar() + '<div class="view">' + html + '</div>';
  window.scrollTo(0,0);
  if (view.name === 'game') afterRenderGame();
}

function viewHome(){
  let cards = '';
  BOOK.units.forEach(u => {
    let st = 0, doneLv = 0;
    for (let i = 0; i < NLV; i++){
      const n = S.progress[u.id + '-' + i] || 0;
      st += n;
      if (n >= 1) doneLv++;
    }
    const pct = Math.round(st / MAX_STAR * 100);
    const tag = doneLv === NLV ? '已通关' : (doneLv > 0 ? '继续挑战' : '新单元');
    cards += '<button class="ucard" onclick="openUnit(\'' + u.id + '\')">' +
      '<div class="uart">' + artSVG(u.id) + '<div class="glow"></div>' +
        '<span class="chip-tag">' + tag + '</span>' +
        '<span class="chap">' + (doneLv === NLV ? '✓' : '▶') + '</span>' +
      '</div>' +
      '<div class="ubody">' +
        '<div class="uno">' + u.no + '</div>' +
        '<div class="utitle">' + esc(u.title) + '</div>' +
        '<div class="ucn">' + esc(u.cn) + '</div>' +
        '<div class="ubar"><i style="width:' + Math.max(pct, 3) + '%;background:linear-gradient(90deg,' + u.color + ',' + u.c2 + ')"></i></div>' +
        '<div class="umeta"><span>' + doneLv + '/' + NLV + ' 关</span><span style="color:#f6a723">★ ' + st + '/' + MAX_STAR + '</span></div>' +
      '</div>' +
    '</button>';
  });
  SOON.forEach(su => {
    cards += '<button class="ucard locked" disabled>' +
      '<div class="uart">' + artSVG(su.id) + '<div class="glow"></div>' +
        '<span class="chip-tag">即将开放</span>' +
      '</div>' +
      '<div class="ubody">' +
        '<div class="uno">' + su.no + '</div>' +
        '<div class="utitle">' + esc(su.title) + '</div>' +
        '<div class="ucn">' + esc(su.cn) + '</div>' +
      '</div>' +
    '</button>';
  });

  const doneCount = Object.keys(S.progress).filter(k => (S.progress[k] || 0) > 0).length;

  return '' +
  '<div class="hero">' +
    '<div class="inner">' +
      '<div class="txt">' +
        '<h1>七年级上册<br>英语闯关</h1>' +
        '<div class="sub">人教版 PEP · 课内同步 · 边玩边提分</div>' +
        '<div class="pills">' +
          '<span class="pill">连续 ' + S.streak + ' 天</span>' +
          '<span class="pill">已通关 ' + doneCount + ' 关</span>' +
        '</div>' +
      '</div>' +
      '<div class="mascot">' + mascotSVG() + '</div>' +
    '</div>' +
    '<div class="lvl">' +
      '<div class="lvlbar"><i style="width:' + lvPct() + '%"></i></div>' +
      '<div class="lvtxt"><span>Lv ' + lv() + '</span><span>再得 ' + lvLeft() + ' 经验升级</span></div>' +
    '</div>' +
  '</div>' +
  '<div class="quickrow">' +

function viewUnit(uid){
  const u = BOOK.units.find(x => x.id === uid);
  if (!u) return viewHome();
  const starsOf = i => S.progress[uid + '-' + i] || 0;
  let total = 0, doneLv = 0;
  for (let i = 0; i < NLV; i++){ total += starsOf(i); if (starsOf(i) >= 1) doneLv++; }

  let cur = BOSS;
  for (let i = 0; i < NLV; i++){ if (starsOf(i) === 0){ cur = i; break; } }

  let nodes = '';
  LEVEL_DEFS.forEach((d, i) => {
    let unlocked;
    if (i === 0) unlocked = true;
    else if (i < BOSS) unlocked = starsOf(i - 1) >= 1;
    else {
      /* Boss 关：前面所有小关都至少 1 星才解锁 */
      unlocked = true;
      for (let k = 0; k < BOSS; k++){ if (starsOf(k) < 1){ unlocked = false; break; } }
    }
    const st = starsOf(i);
    const color = unlocked ? LEVEL_COLORS[i] : '#eaeefa';
    const cls = (unlocked ? '' : 'locked') + (unlocked && i === cur ? ' cur' : '') + (st > 0 ? ' done' : '');
    nodes += '<button class="node ' + cls + '"' + (unlocked ? ' onclick="startLevel(\'' + uid + '\',' + i + ')"' : ' disabled') + '>' +
      '<span class="dot" style="background:linear-gradient(140deg,' + color + ',' + shade(color) + ')">' + (unlocked ? d.ico : lockSVG(18)) + '</span>' +
      '<span class="nlabel">' + d.short + '</span>' +
      '<span class="nstars">' + (unlocked ? miniStars(st) : '') + '</span>' +
    '</button>';
  });

  const allDone = doneLv === NLV;
  const ctaText = allDone ? '本单元已通关 · 再练一遍 Boss' : ('继续闯关 · ' + LEVEL_DEFS[cur].n);
  const ctaSub = allDone ? '星数可以继续刷新' : LEVEL_DEFS[cur].s;
  const ctaIdx = allDone ? BOSS : cur;

  return '' +
  '<div class="phead">' +
    '<button class="iconbtn" onclick="goHome()">←</button>' +
    '<div><div class="pht">' + u.no + ' · ' + esc(u.cn) + '</div><div class="phs">' + esc(u.title) + '</div></div>' +
  '</div>' +
  '<div class="hero" style="background:linear-gradient(135deg,' + u.color + ' 0%,' + u.c2 + ' 100%);box-shadow:0 24px 52px ' + hexA(u.color, .34) + ',inset 0 1px 0 rgba(255,255,255,.28)">' +
    '<div class="inner">' +
      '<div class="txt">' +
        '<h1>' + esc(u.title) + '</h1>' +
        '<div class="sub">' + esc(u.cn) + ' · 通关 Boss 获得「' + esc(u.badge) + '」</div>' +
        '<div class="pills">' +
          '<span class="pill">★ ' + total + ' / ' + MAX_STAR + '</span>' +
          '<span class="pill">已通关 ' + doneLv + ' / ' + NLV + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="mascot">' + mascotSVG() + '</div>' +
    '</div>' +
  '</div>' +
  '<div class="mapcard">' +
    '<div class="path">' + nodes + '</div>' +
    '<div class="maptip">💡 <span>依次闯关，<b>六个小关</b>全部拿到星星后开启 Boss 关，通关即可收集「' + esc(u.badge) + '」。</span></div>' +
    '<button class="btn block" style="margin-top:14px" onclick="startLevel(\'' + uid + '\',' + ctaIdx + ')">' +
      ctaText + '<span style="display:block;font-size:11.5px;font-weight:700;opacity:.82;margin-top:3px">' + ctaSub + '</span>' +
    '</button>' +
  '</div>';
}

function hexA(hex, a){
  const m = /^#([0-9a-f]{6})$/i.exec(hex);
  if (!m) return 'rgba(79,107,237,' + a + ')';
  const n = parseInt(m[1], 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function shade(hex){
  const m = /^#([0-9a-f]{6})$/i.exec(hex);
  if (!m) return '#ddd';
  const n = parseInt(m[1], 16);
  const r = Math.max(0, ((n >> 16) & 255) - 36);
  const g = Math.max(0, ((n >> 8) & 255) - 36);
  const b = Math.max(0, (n & 255) - 36);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function viewGame(){
  if (!G) return viewHome();
  if (G.i >= G.qs.length) return '';
  const q = G.qs[G.i];
  const total = G.qs.length;
  const pct = Math.round(G.i / total * 100);
  let body = '';
  if (q.type === 'choice') body = renderChoice(q);
  else if (q.type === 'listen') body = renderListen(q);
  else if (q.type === 'order') body = renderOrder(q);
  else if (q.type === 'speak') body = renderSpeak(q);
  else if (q.type === 'spell') body = renderSpell(q);
  else if (q.type === 'grammar') body = renderGrammar(q);

  const typeName = { word:'单词', fill:'句型', listen:'听力', order:'句型', speak:'跟读', spell:'拼写', grammar:'语法' }[q.type === 'choice' ? q.qtype : q.type] || '练习';
  const combo = (G.combo >= 2) ? '<div class="combo">🔥 连对 ' + G.combo + ' 题</div>' : '';
  const compact = (q.type === 'order' || q.type === 'speak' || q.type === 'spell') ? ' compact' : '';

  return '' +
  '<div class="hud">' +
    '<button class="iconbtn" onclick="quitLevel()" title="退出">✕</button>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="cnt">' + (G.i + 1) + ' / ' + total + '</div>' +
  '</div>' +
  combo +
  '<div class="qcard' + compact + '" id="qcard">' +
    '<div class="qtype">' + (G.mode === 'review' ? '错题复习' : typeName) + '</div>' +
    '<div class="qbody">' + body + '</div>' +
    '<div id="fb" class="fb"></div>' +

/* --- 拼写关 --- */
function renderSpell(q){
  const ltrs = q.letters.map(function(c,i){
    return '<button class="ltr" id="lt' + i + '" onclick="pickLetter(' + i + ')">' + esc(c) + '</button>';
  }).join('');
  return '' +
  '<div class="qprompt small">中文：' + esc(q.cn) + '</div>' +
  '<div class="qsub">按顺序点字母，拼出这个单词</div>' +

  '<div class="letters" id="letters">' + ltrs + '</div>';
}
function updateSpellUI(){
  if (!G) return;
  const q = G.qs[G.i];
  const line = document.getElementById('spellline');
  if (line){
    line.innerHTML = G.spellPicked.length
      ? G.spellPicked.map(function(idx,pos){
          return '<span class="sltr" onclick="unpickLetter(' + pos + ')">' + esc(q.letters[idx]) + '</span>';
        }).join('')
      : '<span class="ph">点下面的字母开始拼</span>';
  }
  q.letters.forEach(function(c,i){
    const el = document.getElementById('lt' + i);
    if (el) el.classList.toggle('used', G.spellPicked.indexOf(i) >= 0);
  });
}
function pickLetter(i){
  if (!G || G.answered) return;
  const q = G.qs[G.i];
  if (G.spellPicked.indexOf(i) >= 0) return;
  sfxTap();
  G.spellPicked.push(i);
  updateSpellUI();
  if (G.spellPicked.length >= q.answer.replace(/[^a-zA-Z]/g,'').length) checkSpell();
}
function unpickLetter(pos){
  if (!G || G.answered) return;
  sfxTap();
  G.spellPicked.splice(pos, 1);
  updateSpellUI();
}
function checkSpell(){
  if (!G || G.answered) return;
  const q = G.qs[G.i];
  const built = G.spellPicked.map(function(i){ return q.letters[i]; }).join('');
  const ok = built.toLowerCase() === q.answer.toLowerCase();

  if (ok){
    G.answered = true;
    G.correct++; G.combo = (G.combo || 0) + 1;
    if (G.mode === 'review') removeWrong(q);
    sfxOk();
    const line = document.getElementById('spellline');
    if (line) line.classList.add('ok');
    feedback(true, q);
    showNext();
    return;
  }

  /* 第一次拼错给提示、允许重来；第二次才判错，避免一个手滑就断掉连对 */
  q.tries = (q.tries || 0) + 1;
  G.combo = 0;
  sfxNo();
  const card = document.getElementById('qcard');
  if (card){ card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }

  if (q.tries < 2){
    G.spellPicked = [];
    updateSpellUI();
    const fb = document.getElementById('fb');
    if (fb){
      fb.className = 'fb show info';
      fb.innerHTML = '<span class="fbi">!</span><span>还差一点，再试一次。提示：<b>' + esc(q.hint) + '</b></span>';
    }
  } else {
    G.answered = true;
    addWrong(q);
    const line = document.getElementById('spellline');
    if (line) line.classList.add('bad');
    feedback(false, q);
    showNext();
  }
}

/* ============================================================
   答题逻辑
   ============================================================ */
function markOptions(chosen, ok){
  const q = G.qs[G.i];
  q.options.forEach(function(o,i){
    const el = document.getElementById('opt' + i);
    if (!el) return;
    el.disabled = true;
    el.classList.add('dim');
    if (o === q.answer){ el.classList.remove('dim'); el.classList.add('correct'); }
    if (i === chosen && !ok){ el.classList.remove('dim'); el.classList.add('wrong'); }
  });
}
function chooseOption(i){
  if (!G || G.answered) return;
  const q = G.qs[G.i];
  const chosen = q.options[i];
  const ok = chosen === q.answer;
  G.answered = true;
  markOptions(i, ok);
  if (ok){
    G.correct++; G.combo = (G.combo || 0) + 1;
    if (G.mode === 'review') removeWrong(q);
    sfxOk();
  } else {
    G.combo = 0; addWrong(q); sfxNo();
    const card = document.getElementById('qcard');
    if (card) card.classList.add('shake');
  }
  feedback(ok, q);
  showNext();
}
function feedback(ok, q){
  const fb = document.getElementById('fb');
  if (!fb) return;
  fb.className = 'fb show ' + (ok ? 'ok' : 'no');
  const gexp = (q.type === 'grammar' && q.explain)
    ? '<div class="gexp">📘 <b>' + esc(q.point) + '</b>：' + esc(q.explain) + '</div>' : '';
  if (ok){
    fb.innerHTML = '<span class="fbi">✓</span><span>答对了！' + (G.combo >= 2 ? '连对 ' + G.combo + ' 题，真棒 🎉' : '继续保持 ✨') + gexp + '</span>';
  } else {
    let ans = q.answer || '';
    if (q.type === 'order') ans = q.display || '';
    let body = '正确答案：<b>' + esc(ans) + '</b>';
    if (q.type === 'spell') body += '（' + esc(q.cn) + '）';
    else if (q.note) body += '<br>' + esc(q.note);
    fb.innerHTML = '<span class="fbi">✕</span><span>' + body + gexp + '</span>';
  }
}
function showNext(){
  const b = document.getElementById('nextBtn');
  if (b) b.style.display = 'block';
}
function nextQuestion(){
  if (!G) return;
  G.i++;
  G.answered = false;

/* --- 跟读题 --- */
function sim(a, b){
  a = String(a).toLowerCase().replace(/[^a-z0-9 ]/g,'').split(/\s+/).filter(Boolean);
  b = String(b).toLowerCase().replace(/[^a-z0-9 ]/g,'').split(/\s+/).filter(Boolean);
  if (!a.length || !b.length) return 0;
  if (a.length === 1){ return b.join(' ').indexOf(a[0]) >= 0 ? 1 : 0; }
  const setB = {}; b.forEach(function(w){ setB[w] = 1; });
  let hit = 0; a.forEach(function(w){ if (setB[w]) hit++; });
  return hit / a.length;
}
/* 首次使用麦克风前先说明：音频去哪、游戏有没有服务器、能不能拒绝 */
function micNotice(){
  const fb = document.getElementById('fb');
  if (!fb) return;
  fb.className = 'fb show info';
  fb.innerHTML = '<span class="fbi">!</span><span><b>关于麦克风</b><br>' +
    '点「同意并开始」后，浏览器会请求麦克风权限。语音识别由浏览器自带能力完成——' +
    '本游戏没有服务器，不接收、不上传、也不保存任何录音，打分只用到识别出的文字。' +
    '<div style="display:flex;gap:9px;margin-top:10px">' +
      '<button class="btn sm" style="flex:1" onclick="agreeMic()">同意并开始</button>' +
      '<button class="btn ghost sm" style="flex:1" onclick="micSkip()">不用麦克风</button>' +
    '</div></span>';
}
function agreeMic(){
  S.micOK = true; save();
  const fb = document.getElementById('fb');
  if (fb){ fb.className = 'fb'; fb.innerHTML = ''; }
  startRecord();
}
function micSkip(){
  const fb = document.getElementById('fb');
  if (fb){ fb.className = 'fb'; fb.innerHTML = ''; }
  selfAssess();
}

function startRecord(){
  if (!G || G.answered) return;
  if (!S.micOK){ micNotice(); return; }
  const q = G.qs[G.i];
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ selfAssess(); return; }
  let rec;
  try { rec = new SR(); } catch(e){ selfAssess(); return; }
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
  const btn = document.getElementById('micBtn');
  const tip = document.getElementById('recTip');
  if (btn) btn.classList.add('rec');
  if (tip) tip.textContent = '正在听…请朗读';
  let done = false;
  /* 兜底：用户忽略权限弹窗或环境没有麦克风时，9 秒后自动降级为自评，避免卡在"正在听" */
  const timer = setTimeout(function(){
    if (done) return;
    done = true;
    try { rec.abort(); } catch(e){}
    if (btn) btn.classList.remove('rec');
    if (tip) tip.textContent = '没有听到声音，先听示范再试';
    selfAssess();
  }, 9000);
  rec.onresult = function(e){
    done = true; clearTimeout(timer);
    const heard = e.results[0][0].transcript;
    evalSpeak(q, heard);
  };
  rec.onerror = function(){ clearTimeout(timer); if (!done){ if (btn) btn.classList.remove('rec'); selfAssess(); } };
  rec.onend = function(){ clearTimeout(timer); if (btn) btn.classList.remove('rec'); };
  try { rec.start(); } catch(e){ selfAssess(); }
}
function evalSpeak(q, heard){
  const s = sim(q.text, heard);
  const ok = s >= 0.5;
  G.answered = true;
  if (ok){
    G.correct++; G.combo = (G.combo || 0) + 1;
    if (G.mode === 'review') removeWrong(q);
    sfxOk();
  } else {
    G.combo = 0; addWrong(q); sfxNo();
  }
  const fb = document.getElementById('fb');
  if (fb){
    fb.className = 'fb show ' + (ok ? 'ok' : 'no');
    fb.innerHTML = ok
      ? '<span class="fbi">✓</span><span>识别到：' + esc(heard) + '<br>相似度 ' + Math.round(s*100) + '%，读得不错！</span>'
      : '<span class="fbi">✕</span><span>识别到：' + esc(heard || '（没听清）') + '<br>先听示范，再试一次</span>';
  }
  const tip = document.getElementById('recTip');
  if (tip) tip.textContent = '';
  showNext();
}
function selfAssess(){
  const fb = document.getElementById('fb');
  if (!fb) return;
  fb.className = 'fb show info';
  fb.innerHTML = '<span class="fbi">!</span><span>当前浏览器不支持语音识别，请听示范后自评：' +
    '<div style="display:flex;gap:9px;margin-top:10px">' +
      '<button class="btn sm" style="flex:1" onclick="evalSelf(true)">我读对了</button>' +
      '<button class="btn ghost sm" style="flex:1" onclick="evalSelf(false)">再练一次</button>' +
    '</div></span>';
}
function evalSelf(ok){
  if (!G || G.answered) return;
  const q = G.qs[G.i];
  G.answered = true;
  if (ok){
    G.correct++; G.combo = (G.combo || 0) + 1;
    if (G.mode === 'review') removeWrong(q);
    sfxOk();
  } else {
    G.combo = 0; addWrong(q);
  }
  const fb = document.getElementById('fb');
  if (fb){
    fb.className = 'fb show ' + (ok ? 'ok' : 'no');
    fb.innerHTML = ok
      ? '<span class="fbi">✓</span><span>很好，继续保持！</span>'
      : '<span class="fbi">✕</span><span>没关系，多听几遍再试。</span>';
  }
  showNext();
}

/* ============================================================
   结算
   ============================================================ */
function finishLevel(){
  const total = G.qs.length;
  const acc = total ? G.correct / total : 0;
  const stars = acc >= 0.9 ? 3 : acc >= 0.75 ? 2 : acc >= 0.6 ? 1 : 0;
  let coins = 0, xp = 0, newBest = false;

  if (G.mode === 'review'){
    coins = G.correct * 8;
    xp = G.correct * 6;
  } else {
    const key = G.uid + '-' + G.idx;
    const prev = S.progress[key] || 0;
    if (stars > prev){ S.progress[key] = stars; newBest = true; }
    const firstClear = prev === 0 && stars >= 1;
    coins = stars * 20 + G.correct * 5 + (firstClear ? 30 : 0);
    xp = G.correct * 10 + stars * 15;
    if (G.idx === BOSS && stars >= 1 && S.collect.indexOf(G.uid) < 0){
      S.collect.push(G.uid); coins += 50;
    }
  }
  S.coins += coins; S.xp += xp; save();
  G.result = { total:total, correct:G.correct, acc:acc, stars:stars, coins:coins, xp:xp, newBest:newBest, wrongCount:G.wrongList.length };
  view = { name:'result' };
  render();
  if (G.mode === 'review'){ if (stars >= 1 || G.correct > 0) sfxWin(); }
  else {
    if (stars >= 1){ setTimeout(sfxWin, 120); fireConfetti(38 + stars * 16); }
    else sfxNo();
  }
}

function fireConfetti(n){
  try {
    const wrap = document.createElement('div');
    wrap.className = 'confetti';
    const colors = ['#4f6bed','#8a63e8','#f6a723','#20b878','#f2545b','#ffd166','#5bcfd8'];
    for (let i = 0; i < n; i++){
      const c = document.createElement('i');
      c.className = 'cf';
      c.style.left = (Math.random() * 100) + '%';
      c.style.background = colors[rnd(colors.length)];
      c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.5) + 's';
      c.style.width = (6 + Math.random() * 7) + 'px';
      c.style.height = (10 + Math.random() * 10) + 'px';
      c.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      c.style.opacity = 0.9;
      wrap.appendChild(c);
    }
    document.body.appendChild(wrap);
    setTimeout(function(){ try{ document.body.removeChild(wrap); }catch(e){} }, 4200);
  } catch(e){}
}

function viewResult(){
  if (!G || !G.result) return viewHome();
  const r = G.result;
  const isReview = G.mode === 'review';
  const title = isReview ? '复习完成！' : (r.stars >= 1 ? '通关成功！' : '再挑战一次吧');
  const sub = isReview
    ? '复习了 ' + r.total + ' 题，答对 ' + r.correct + ' 题'
    : (r.stars >= 1 ? '这一关完成得很好，继续加油' : '正确率还不够，回去再练一练');

  const starsHtml = isReview
    ? '<div class="rewardpop">✓ 复习完成 · 已清理 ' + r.correct + ' 道错题</div>'
    : '<div class="bigstars">' +
        '<span class="' + (r.stars >= 1 ? 'on' : 'off') + '">' + (r.stars >= 1 ? '★' : '☆') + '</span>' +
        '<span class="' + (r.stars >= 2 ? 'on' : 'off') + '">' + (r.stars >= 2 ? '★' : '☆') + '</span>' +
        '<span class="' + (r.stars >= 3 ? 'on' : 'off') + '">' + (r.stars >= 3 ? '★' : '☆') + '</span>' +
      '</div>';

  const backFn = isReview ? 'goHome()' : ('openUnit(\'' + G.uid + '\')');
  const againBtn = isReview ? '' :
    '<button class="btn" onclick="startLevel(\'' + G.uid + '\',' + G.idx + ')">再玩一次</button>';
  const reviewBtn = (!isReview && r.wrongCount)
    ? '<button class="btn gold block" onclick="openReview()">去复习这 ' + r.wrongCount + ' 道错题</button>' : '';
  const collectTip = (!isReview && G.idx === BOSS && r.stars >= 1 && S.collect.indexOf(G.uid) >= 0)
    ? '<div class="rewardpop">🏅 获得收藏「' + esc(G.unit.badge) + '」</div>' : '';

  let note = '获得经验 +' + r.xp;
  if (r.newBest) note += ' · 刷新最高星数';
  if (r.wrongCount && !isReview) note += ' · 错题已加入复习队列';

  return '' +
  '<div class="result">' +
    '<div class="rmasc">' + mascotSVG() + '</div>' +
    '<div class="rtitle">' + title + '</div>' +
    '<div class="rsub">' + sub + '</div>' +
    starsHtml +
    '<div class="rgrid">' +
      '<div class="rcell"><b>' + r.correct + '/' + r.total + '</b><span>答对</span></div>' +
      '<div class="rcell"><b>' + Math.round(r.acc * 100) + '%</b><span>正确率</span></div>' +
      '<div class="rcell"><b>+' + r.coins + '</b><span>金币</span></div>' +
    '</div>' +
    '<div class="rnote">' + note + '</div>' +
    '<div class="actions">' +
      '<button class="btn ghost" onclick="' + backFn + '">返回</button>' +
      againBtn +
    '</div>' +
    reviewBtn +
    collectTip +
  '</div>';
}

/* ============================================================
   收集图鉴
   ============================================================ */
function viewCollect(){
  const card = (u, got) =>
    '<div class="ccard ' + (got ? 'got' : 'locked') + '">' +
      '<div class="cimg">' + artSVG(u.id) +
        (got ? '<span class="cstamp">已收集</span>' : '<span class="clock"><b>' + lockSVG(22) + '</b></span>') +
      '</div>' +
      '<div class="cbody">' +
        '<div class="ccname">' + esc(got ? u.badge : '待解锁') + '</div>' +
        '<div class="ccunit">' + u.no + ' · ' + esc(u.title) + '</div>' +
        '<div class="ccstat ' + (got ? 'ok' : 'no') + '">' + (got ? '★ 已收入图鉴' : 'Boss 通关解锁') + '</div>' +
      '</div>' +
    '</div>';

  let cards = BOOK.units.map(function(u){ return card(u, S.collect.indexOf(u.id) >= 0); }).join('');
  let locked = SOON.map(function(su){ return card(su, false); }).join('');

  return '' +
  '<div class="phead">' +
    '<button class="iconbtn" onclick="goHome()">←</button>' +
    '<div><div class="pht">收集图鉴</div><div class="phs">已收集 ' + S.collect.length + ' / ' + BOOK.units.length + '</div></div>' +
  '</div>' +
  '<div class="hintline">通关每个单元的 Boss 关，即可收集该单元的主题纪念品</div>' +
  '<div class="collectgrid">' + cards + locked + '</div>';
}

/* 启动 */
render();
</script>
